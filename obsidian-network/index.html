<!DOCTYPE html>
<meta charset="utf-8">
<title>Redirecting to CineGraph</title>
<link rel="canonical" href="https://areeslindley.github.io/CineGraph/">
<script>
  var dest =
    "https://areeslindley.github.io/CineGraph" +
    location.pathname.replace(/^\/obsidian-network\/?/, "/") +
    location.search +
    location.hash;
  location.replace(dest);
</script>
<noscript>
  <meta http-equiv="refresh" content="0; url=https://areeslindley.github.io/CineGraph/">
  <p>Moved to <a href="https://areeslindley.github.io/CineGraph/">CineGraph</a>.</p>
</noscript>
